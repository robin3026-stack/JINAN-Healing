    /* 이퀄라이저 애니메이션 (재생 중인 아이콘 표시) */
    @keyframes eqBounce {
      0%, 100% { transform: scaleY(0.25); }
      50% { transform: scaleY(1); }
    }
    .eq-bar {
      transform-origin: bottom;
      animation: eqBounce 0.85s ease-in-out infinite;
    }
    .eq-bar:nth-child(1) { animation-delay: 0.0s; }
    .eq-bar:nth-child(2) { animation-delay: 0.22s; }
    .eq-bar:nth-child(3) { animation-delay: 0.44s; }
    .eq-bar:nth-child(4) { animation-delay: 0.15s; }

    .paused .eq-bar {
      animation-play-state: paused;
      transform: scaleY(0.35);
    }

    // GitHub 기본 주소에서 실제 인코딩된 오디오 URL 생성
    function buildTrackAudioUrl(track) {
      const encodedFile = encodeURIComponent(track.fileName);
      // GitHub Pages 환경에서는 같은 저장소 내 음원 파일을 상대 경로로 즉시 로드
      if (window.location.hostname.endsWith('github.io') || !ADMIN_GITHUB_BASE_URL) {
        return `./${encodedFile}`;
      }
      const cleanBase = ADMIN_GITHUB_BASE_URL.trim().replace(/\/+$/, '');
      return `${cleanBase}/${encodedFile}`;
    }
